name: broker-reasoning-validation

on:
  pull_request:
    paths:
      - "schemas/broker-reasoning/**"
      - "examples/broker-reasoning/**"
      - "tools/validate_broker_reasoning_examples.py"
      - ".github/workflows/broker-reasoning-validation.yml"
  push:
    branches:
      - main
    paths:
      - "schemas/broker-reasoning/**"
      - "examples/broker-reasoning/**"
      - "tools/validate_broker_reasoning_examples.py"
      - ".github/workflows/broker-reasoning-validation.yml"

jobs:
  validate-broker-reasoning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependency
        run: python -m pip install jsonschema
      - name: Validate broker reasoning examples
        run: python tools/validate_broker_reasoning_examples.py
