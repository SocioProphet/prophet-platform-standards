name: Multi-Domain Geospatial Standards

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate platform standards registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate multi-domain geospatial standards registry
        run: make multidomain-geospatial-validate
